<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>发卡管理后台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
  body{min-height:100vh;background:#0f172a;color:#e2e8f0;padding:30px}
  .wrap{max-width:1000px;margin:0 auto}
  h1{color:#38bdf8;font-size:22px;margin-bottom:20px}
  .panel{background:#1e293b;border-radius:10px;padding:22px;margin-bottom:20px}
  .panel h2{font-size:15px;color:#94a3b8;margin-bottom:14px}
  input,select{padding:10px 12px;background:#0f172a;border:1px solid #334155;
    border-radius:6px;color:#fff;outline:none;font-size:14px}
  input:focus{border-color:#38bdf8}
  button{padding:10px 22px;border:none;border-radius:6px;cursor:pointer;
    background:#0284c7;color:#fff;font-size:14px;transition:.2s}
  button:hover{background:#0369a1}
  button.red{background:#dc2626}button.red:hover{background:#b91c1c}
  button.teal{background:#0891b2}button.teal:hover{background:#0e7490}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{padding:9px 10px;border-bottom:1px solid #334155;text-align:left}
  th{color:#94a3b8;font-weight:normal}
  .tag{padding:2px 8px;border-radius:10px;font-size:11px}
  .tag.ok{background:#064e3b;color:#6ee7b7}
  .tag.no{background:#7f1d1d;color:#fca5a5}
  .msg{margin-top:10px;font-size:13px;min-height:18px;line-height:1.8}
  .ok{color:#6ee7b7}.err{color:#f87171}
  .cardtext{color:#fbbf24;font-family:monospace;cursor:pointer;font-size:13px}
  .cardtext:hover{text-decoration:underline}
  #loginPanel{max-width:400px;margin:100px auto 0}
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div class="panel" id="loginPanel">
    <h1>🔐 发卡管理后台</h1>
    <h2>输入 GitHub Token 进入</h2>
    <input id="token" type="password" placeholder="ghp_xxxxxxxx" style="width:100%">
    <br><br>
    <button onclick="enter()" style="width:100%">进 入</button>
    <div class="msg" id="lmsg"></div>
  </div>

  <!-- 管理界面 -->
  <div id="mainPanel" style="display:none">
    <h1>🛠️ 发卡管理后台</h1>

    <div class="panel">
      <h2>📌 批量发卡（20位随机大小写字母+数字）</h2>
      <div class="row">
        生成 <input id="count" type="number" value="5" style="width:70px"> 张，每张有效
        <select id="days">
          <option value="1">1 天</option>
          <option value="7">7 天</option>
          <option value="30" selected>30 天</option>
          <option value="90">90 天</option>
          <option value="365">365 天</option>
        </select>
        <button onclick="genCards()">生成卡密</button>
        <button class="red" onclick="clearUsed()">清理已激活卡密</button>
        <button onclick="loadDB(false)">🔄 刷新</button>
      </div>
      <div class="msg" id="gmsg"></div>
    </div>

    <div class="panel">
      <h2>📋 卡密列表（点击卡密可复制）· 共 <span id="total">0</span> 张</h2>
      <input id="search" placeholder="搜索卡密或机器码（不分大小写）..." style="width:280px" oninput="renderTable()">
      <table>
        <thead><tr>
          <th>卡密</th><th>状态</th><th>天数</th><th>激活时间</th><th>到期时间</th><th>绑定机器码</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* ===== 配置：仓库不对就改这里 ===== */
const CONFIG = { owner:'zzqwq1', repo:'twoweb', branch:'main' };
/* ================================== */

const $ = id => document.getElementById(id);
const API = 'https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/cards.json';
let TOKEN = '', DB = null, SHA = '';

function enter(){
  TOKEN = $('token').value.trim();
  if(TOKEN === '') return $('lmsg').innerHTML = '<span class="err">请输入Token</span>';
  loadDB(true);
}

/* 读取数据库 */
async function loadDB(first){
  try{
    const res = await fetch(API + '?t=' + Date.now(), {
      headers:{ 'Authorization':'token ' + TOKEN, 'Accept':'application/vnd.github+json' }
    });
    if(res.status === 401) throw new Error('Token 无效或已过期');
    if(res.status === 404) throw new Error('仓库里找不到 cards.json，请先创建');
    const data = await res.json();
    SHA = data.sha;
    DB = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,'')))));
    if(!DB.cards) DB.cards = {};
    if(!DB.bindings) DB.bindings = {};
    if(first){
      $('loginPanel').style.display = 'none';
      $('mainPanel').style.display = 'block';
      sessionStorage.setItem('tw_admin_token', TOKEN);
    }
    renderTable();
    if(!first) $('gmsg').innerHTML = '<span class="ok">已刷新</span>';
  }catch(e){
    $('lmsg').innerHTML = '<span class="err">' + e.message + '</span>';
  }
}

/* 写回 GitHub */
async function saveDB(){
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(DB, null, 2))));
  const res = await fetch(API, {
    method:'PUT',
    headers:{ 'Authorization':'token ' + TOKEN, 'Accept':'application/vnd.github+json' },
    body: JSON.stringify({ message:'更新卡密数据', content:content, sha:SHA, branch:CONFIG.branch })
  });
  if(!res.ok) throw new Error('保存失败（代码' + res.status + '），点刷新后重试');
  SHA = (await res.json()).content.sha;
  // ★ 保存成功后立即清除CDN缓存，让新数据几秒内全球生效 ★
  try{
    await fetch('https://purge.jsdelivr.net/gh/' + CONFIG.owner + '/' + CONFIG.repo + '@' + CONFIG.branch + '/cards.json');
  }catch(e){ /* 清缓存失败不影响保存 */ }
}

/* ★ 生成随机字符：大小写字母 + 数字（已去掉容易看错的 I O l o 0 1）★ */
function rand(n){
  const s = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let r = '';
  for(let i=0;i<n;i++) r += s[Math.floor(Math.random()*s.length)];
  return r;
}

/* 生成卡密：4组×5位 = 20位随机字符（加3个横杠共23位） */
async function genCards(){
  const count = Math.min(parseInt($('count').value) || 1, 50);
  const days = parseInt($('days').value);
  const list = [];
  for(let i=0;i<count;i++){
    const c = rand(5) + '-' + rand(5) + '-' + rand(5) + '-' + rand(5);
    DB.cards[c] = { days:days, activateTime:0, expireTime:0, created:Date.now() };
    list.push(c);
  }
  try{
    $('gmsg').innerHTML = '<span class="ok">正在保存到 GitHub...</span>';
    await saveDB();
    $('gmsg').innerHTML = '<span class="ok">✅ 生成成功（' + days + '天卡 × ' + count + '张），点击卡密复制：</span><br>' +
      list.map(c => '<span class="cardtext" onclick="copyText(\'' + c + '\')">' + c + '</span>').join('<br>');
    renderTable();
  }catch(e){
    $('gmsg').innerHTML = '<span class="err">' + e.message + '</span>';
  }
}

/* 绑定机器码 = 自动激活计时 */
async function bindCard(c){
  const mac = prompt('输入用户的机器码（如 MAC-1234567）：\n\n绑定后立即激活，从现在开始计时');
  if(!mac) return;
  DB.bindings[c] = { mac: mac.trim().toUpperCase(), time: Date.now() };
  if(!DB.cards[c].activateTime){
    DB.cards[c].activateTime = Date.now();
    DB.cards[c].expireTime = Date.now() + DB.cards[c].days * 86400000;
  }
  try{
    await saveDB();
    renderTable();
    alert('✅ 绑定并激活成功！\n' + c + ' → ' + mac.trim().toUpperCase());
  }catch(e){ alert(e.message); }
}

/* 解绑（换机器时用，剩余时间保留） */
async function unbindCard(c){
  if(!confirm('解除 ' + c + ' 的绑定？解绑后原机器无法登录，剩余时间保留')) return;
  delete DB.bindings[c];
  try{ await saveDB(); renderTable(); }catch(e){ alert(e.message); }
}

async function delCard(c){
  if(!confirm('确定删除卡密 ' + c + '？')) return;
  delete DB.cards[c];
  delete DB.bindings[c];
  try{ await saveDB(); renderTable(); }catch(e){ alert(e.message); }
}

async function clearUsed(){
  if(!confirm('删除所有已激活的卡密？（未激活的保留）')) return;
  for(const c in DB.cards){
    if(DB.cards[c].activateTime > 0){
      delete DB.cards[c];
      delete DB.bindings[c];
    }
  }
  try{ await saveDB(); renderTable(); }catch(e){ alert(e.message); }
}

function renderTable(){
  const kw = $('search').value.trim().toLowerCase();
  const now = Date.now();
  const rows = Object.keys(DB.cards)
    .filter(c => kw === '' || c.toLowerCase().indexOf(kw) >= 0 ||
                 (DB.bindings[c] && DB.bindings[c].mac.toLowerCase().indexOf(kw) >= 0))
    .sort((a,b) => (DB.cards[b].created||0) - (DB.cards[a].created||0));
  $('total').textContent = Object.keys(DB.cards).length;
  $('tbody').innerHTML = rows.map(c => {
    const info = DB.cards[c];
    const b = DB.bindings[c];
    const used = info.activateTime > 0;
    const expired = used && info.expireTime < now;
    const status = expired ? '<span class="tag no">已过期</span>'
      : used ? '<span class="tag ok">使用中</span>'
      : '<span class="tag ok">未激活</span>';
    return '<tr>' +
      '<td><span class="cardtext" onclick="copyText(\'' + c + '\')">' + c + '</span></td>' +
      '<td>' + status + '</td>' +
      '<td><b style="color:#38bdf8">' + info.days + '</b> 天</td>' +
      '<td>' + (used ? new Date(info.activateTime).toLocaleDateString('zh-CN') : '—') + '</td>' +
      '<td>' + (used ? new Date(info.expireTime).toLocaleDateString('zh-CN') : '—') + '</td>' +
      '<td style="font-size:11px;color:#94a3b8">' + (b ? b.mac : '未绑定') + '</td>' +
      '<td>' +
        '<button class="teal" style="padding:4px 10px;font-size:12px" onclick="bindCard(\'' + c + '\')">' + (b ? '改绑' : '绑定') + '</button> ' +
        (b ? '<button style="padding:4px 10px;font-size:12px;background:#475569" onclick="unbindCard(\'' + c + '\')">解绑</button> ' : '') +
        '<button class="red" style="padding:4px 10px;font-size:12px" onclick="delCard(\'' + c + '\')">删</button>' +
      '</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="7" style="color:#64748b">暂无卡密，先用上面按钮生成</td></tr>';
}

function copyText(t){
  navigator.clipboard.writeText(t).then(()=>{}, ()=>{});
}

/* 刷新页面自动恢复登录 */
(function(){
  const t = sessionStorage.getItem('tw_admin_token');
  if(t){ TOKEN = t; $('token').value = t; loadDB(true); }
})();
</script>
</body>
</html>
